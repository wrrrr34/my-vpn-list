name: update-subscription

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch: {}      # manual "Run workflow" button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build clean subscription
        run: python filter_subs.py --output subscription.txt

      - name: Commit if changed
        run: |
          git config user.name "sub-bot"
          git config user.email "sub-bot@users.noreply.github.com"
          git add subscription.txt
          git diff --cached --quiet || git commit -m "update $(date -u +%F-%H%M)"
          git push
